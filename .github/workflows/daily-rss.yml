name: Daily KomaVelt Pinterest RSS

on:
  schedule:
    - cron: '30 3 * * *' # Runs daily at 9:00 AM IST
  workflow_dispatch:     # Lets you trigger it manually anytime

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow & FFmpeg
        run: |
          pip install pillow
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Clean old temp files & generate RSS, Pins, and Reels
        run: |
          rm -f reels/tmp_*.jpg
          python generate_rss.py

      - name: Commit and push rss.xml, pins, and reels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A rss.xml pins/ reels/
          git diff --staged --quiet || git commit -m "Auto-update daily rss.xml, pins & reels"
          git push
